name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend (Worker)
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: cd backend && npm install

      - name: Setup & Initialize D1 Database
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 尝试创建数据库（如果已存在会忽略错误）
          npx wrangler d1 create film-album-db || true
          
          # 2. 获取数据库 ID 并写入 wrangler.toml
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="film-album-db") | .uuid')
          echo "Database ID found: $DB_ID"
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          
          # 3. 执行数据库初始化脚本
          npx wrangler d1 execute film-album-db --remote --file=./src/db/schema.sql -y

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'backend'
          command: deploy
          secrets: |
            ADMIN_PASSWORD

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend (Pages)
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Setup & Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 尝试创建 Pages 项目（如果已存在会忽略错误）
          npx wrangler pages project create film-album-web --production-branch main || true
          
          # 执行部署
          npx wrangler pages deploy dist --project-name=film-album-web
